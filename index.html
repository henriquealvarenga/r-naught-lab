<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R Naught Lab — Simulador Epidemiológico</title>
  <meta name="description" content="Simulador epidemiológico educacional com modelo SEIHRD e metapopulação: entenda como parâmetros demográficos e virais moldam a curva de uma epidemia, o pico hospitalar e o número de mortes.">
  <link rel="canonical" href="https://henriquealvarenga.com/r-naught-lab/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://henriquealvarenga.com/r-naught-lab/">

  <!-- Identificação do autor em dados estruturados (schema.org, JSON-LD).
       Invisível para o leitor; lido por Google, ChatGPT, Claude e Gemini.
       O @id da Pessoa é o MESMO usado em henriquealvarenga.com, o que consolida
       a autoria de tudo o que está publicado no domínio numa única entidade. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "https://henriquealvarenga.com/#pessoa",
        "name": "Henrique Alvarenga da Silva",
        "honorificPrefix": "Dr.",
        "jobTitle": "Médico Psiquiatra e Professor de Medicina",
        "url": "https://henriquealvarenga.com",
        "identifier": [
          { "@type": "PropertyValue", "propertyID": "CRM-MG", "value": "31.778" },
          { "@type": "PropertyValue", "propertyID": "RQE", "value": "8381" },
          { "@type": "PropertyValue", "propertyID": "ORCID", "value": "0000-0001-9799-5240" }
        ],
        "affiliation": [
          { "@type": "CollegeOrUniversity", "name": "Universidade Federal de São João del-Rei (UFSJ)" },
          { "@type": "CollegeOrUniversity", "name": "Centro Universitário Presidente Tancredo de Almeida Neves (UNIPTAN)" }
        ],
        "sameAs": [
          "https://orcid.org/0000-0001-9799-5240",
          "https://lattes.cnpq.br/6147640440978297",
          "https://scholar.google.com/citations?user=Fbv4vDsAAAAJ",
          "https://www.linkedin.com/in/henriquealvarengasilva"
        ]
      },
      {
        "@type": "SoftwareApplication",
        "@id": "https://henriquealvarenga.com/r-naught-lab/#app",
        "name": "R Naught Lab — Simulador Epidemiológico Educacional",
        "description": "Simulador com motor SEIHRD e metapopulação, em dois modos: jogo e análise. Mostra como população, densidade, mobilidade, saneamento, R₀, letalidade e período infeccioso moldam a curva de uma epidemia.",
        "author": { "@id": "https://henriquealvarenga.com/#pessoa" },
        "url": "https://henriquealvarenga.com/r-naught-lab/",
        "codeRepository": "https://github.com/henriquealvarenga/r-naught-lab",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Navegador web",
        "isAccessibleForFree": true,
        "inLanguage": ["pt-BR", "en"],
        "audience": { "@type": "EducationalAudience", "educationalRole": "student" },
        "about": [
          { "@type": "Thing", "name": "Epidemiologia" },
          { "@type": "Thing", "name": "Modelo SEIHRD" },
          { "@type": "Thing", "name": "Número básico de reprodução" }
        ]
      }
    ]
  }
  </script>
  <link rel="stylesheet" href="./src/ui/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 id="app-title">R Naught Lab</h1>
      <p id="app-subtitle"></p>
    </div>
    <div class="top-actions">
      <div class="tabs">
        <button id="mode-game" class="tab active">Jogo</button>
        <button id="mode-analysis" class="tab">Analise</button>
      </div>
      <div class="lang">
        <button id="lang-pt" class="lang-btn">PT</button>
        <button id="lang-en" class="lang-btn">EN</button>
      </div>
    </div>
  </header>

  <!-- ===================== MODO JOGO (montado por src/game) ================ -->
  <div id="game-root"></div>

  <!-- ===================== MODO ANALISE (painel-dashboard) ================= -->
  <div id="analysis-root" style="display:none">
    <div class="analysis-subtabs">
      <div class="tabs">
        <button id="tab-sandbox" class="tab active">Modo Livre</button>
        <button id="tab-scenarios" class="tab">Cenarios</button>
      </div>
    </div>

    <main class="layout">
      <!-- Sidebar de controles (sempre visivel) -->
      <aside class="sidebar">
        <section class="ctrl-group">
          <h3 id="h-pathogen">🦠 Patogeno</h3>
          <div id="pathogen-controls"></div>
        </section>

        <section class="ctrl-group">
          <h3 id="h-cities">🏙️ Cidades</h3>
          <div id="city-controls"></div>
        </section>

        <section class="ctrl-group">
          <h3 id="h-interventions">🛡️ Intervencoes</h3>
          <div id="intervention-controls"></div>
        </section>

        <div class="run-bar">
          <button id="btn-reset" class="ghost">Reiniciar</button>
        </div>
      </aside>

      <!-- Conteudo principal -->
      <section class="content">
        <div id="scenarios-panel" style="display:none">
          <h3>Cenarios guiados</h3>
          <div id="scenario-list" class="scenario-list"></div>
        </div>
        <div id="sandbox-panel"></div>

        <div id="scenario-result" class="scenario-result" style="display:none"></div>

        <div id="kpis" class="kpis"></div>

        <div class="charts-grid">
          <canvas id="chart-epidemic" class="chart"></canvas>
          <canvas id="chart-rt" class="chart"></canvas>
          <canvas id="chart-hospital" class="chart"></canvas>
          <canvas id="chart-incidence" class="chart"></canvas>
        </div>
        <div id="explanation" class="explanation"></div>

        <p id="disclaimer" class="disclaimer"></p>
      </section>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
